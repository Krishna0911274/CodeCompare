{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}CodeCompare{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">
      <div class="container">
        <a href="{% url 'home' %}" class="navbar-brand"> CodeCompare </a>

        <div class="navbar-menu">
          {% if user.is_authenticated %}

          <span class="nav-user"> Welcome, {{ user.username }} </span>

          <a href="{% url 'compiler' %}" class="nav-link"> Compiler </a>

          <a href="{% url 'code_history' %}" class="nav-link"> 📜 History </a>

          <form
            method="post"
            action="{% url 'logout' %}"
            style="display: inline"
          >
            {% csrf_token %}

            <button type="submit" class="logout-btn">Logout</button>
          </form>

          {% else %}

          <a href="{% url 'login' %}" class="nav-link"> Login </a>

          <a href="{% url 'register' %}" class="register-btn"> Register </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <!-- ================= PAGE CONTENT ================= -->

    {% block content %} {% endblock %}

    <!-- ================= MONACO ================= -->

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>

    <!-- ================= PAGE SCRIPTS ================= -->

    {% block scripts %} {% endblock %}
  </body>
</html>
